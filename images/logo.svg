<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1c1a12"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f0a020"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- collapsed panel: the warning count, details hidden -->
  <g filter="url(#shadow)">
    <rect x="300" y="120" width="680" height="300" rx="26" fill="#1f2530" stroke="#3a4352" stroke-width="2"/>
  </g>
  <!-- warning triangle -->
  <path d="M410 178 L478 300 L342 300 Z" fill="url(#amber)" stroke="url(#amber)" stroke-width="18" stroke-linejoin="round"/>
  <rect x="404" y="214" width="12" height="46" rx="6" fill="#1f2530"/>
  <circle cx="410" cy="279" r="8" fill="#1f2530"/>
  <!-- title line + count pill -->
  <rect x="520" y="198" width="250" height="26" rx="8" fill="#f2f4f7"/>
  <rect x="790" y="194" width="120" height="34" rx="17" fill="#f0b429" fill-opacity=".28"/>
  <rect x="808" y="205" width="84" height="12" rx="6" fill="#f6c453"/>
  <!-- hidden details, blurred bars -->
  <g opacity=".35">
    <rect x="520" y="252" width="320" height="16" rx="6" fill="#f2f4f7"/>
    <rect x="520" y="284" width="250" height="16" rx="6" fill="#f2f4f7"/>
  </g>
  <!-- eye-off: spoiler-conscious -->
  <g transform="translate(890 330)" fill="none" stroke="#f2f4f7" stroke-width="9" stroke-linecap="round" opacity=".8">
    <path d="M-44 0 C-26 -26 26 -26 44 0 C26 26 -26 26 -44 0 Z"/>
    <circle cx="0" cy="0" r="11"/>
    <path d="M-40 -32 L40 32"/>
  </g>
  <rect x="340" y="352" width="300" height="8" rx="4" fill="#f2f4f7" opacity=".25"/>

  <text x="640" y="590" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" font-size="104" fill="#f2f4f7" letter-spacing="1">Content <tspan fill="#f6b830">Warnings</tspan></text>
</svg>
